name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test, Build & Package Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run verification checks
        run: bun run check

      # A published Skill may name only what the CLI at its CLI Range floor publishes. The offline
      # half runs inside `bun run check` on a checked-in fixture; this step regenerates that fixture
      # from each release the manifest declares, fails when it has drifted, and checks the Skills
      # against the live surface so nothing passes by naming a command that only exists on `main`.
      - name: Check the Skills name only what the CLI publishes
        run: |
          for floor in $(bun scripts/cli-schema-fixture.ts --floors); do
            bun scripts/cli-schema-fixture.ts --floor "$floor" \
              --out "$RUNNER_TEMP/cli-schema-$floor.json" \
              --compare "scripts/fixtures/cli-schema-$floor.json"
          done
          bun scripts/check-skill-command-surface.ts "$RUNNER_TEMP"/cli-schema-*.json
